<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>문의가 접수되었습니다</title>
</head>
<body style="margin:0;padding:24px;background:#f6f7f9;font-family:'Apple SD Gothic Neo',sans-serif;">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;">
  <h1 style="margin:0 0 16px;font-size:20px;color:#111827;">문의가 접수되었습니다</h1>
  <p style="margin:0 0 24px;font-size:14px;line-height:1.7;color:#4b5563;">
    보내주신 문의를 정상적으로 접수했습니다. 확인 후 이 메일 주소로 답변드리겠습니다.
  </p>
  <table style="width:100%;border-collapse:collapse;font-size:14px;color:#374151;">
    <tr>
      <td style="padding:8px 0;color:#6b7280;width:96px;">문의 번호</td>
      <td style="padding:8px 0;" th:text="${inquiryId}">0</td>
    </tr>
    <tr>
      <td style="padding:8px 0;color:#6b7280;">제목</td>
      <td style="padding:8px 0;" th:text="${title}">제목</td>
    </tr>
  </table>
  <p style="margin:24px 0 0;font-size:12px;color:#9ca3af;">
    이 메일은 발신 전용입니다. 회신하지 말고 새 문의를 남겨주세요.
  </p>
</div>
</body>
</html>
