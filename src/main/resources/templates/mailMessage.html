<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>키오스쿨</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f7f9;">
<!-- 메일 프로그램이 body와 표의 스타일을 지우는 곳이 있어 배경은 표와 칸 모두에 넣는다 -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f6f7f9" style="width:100%;background-color:#f6f7f9;">
  <tr>
    <td align="center" bgcolor="#f6f7f9" style="padding:24px 16px;background-color:#f6f7f9;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:560px;background-color:#ffffff;border-radius:12px;">
        <tr>
          <td align="left" bgcolor="#ffffff" style="padding:32px;text-align:left;background-color:#ffffff;border-radius:12px;font-family:'Apple SD Gothic Neo', 'NanumGothic', 'Malgun Gothic', 'Inter', sans-serif;">
            <!-- 답장에 인용하거나 대화 화면에서 인용을 뺄 때 data-mail-* 속성으로 찾는다 -->
            <div data-mail-content style="font-size:14px;line-height:1.7;color:#374151;overflow-wrap:anywhere;" th:utext="${contentHtml}">내용</div>
            <div th:if="${quoteHtml != null}" data-mail-quote style="margin-top:24px;font-size:13px;line-height:1.6;color:#6b7280;overflow-wrap:anywhere;" th:utext="${quoteHtml}">이전 메일</div>

            <p th:if="${unsubscribeUrl != null}" style="margin:32px 0 0;font-size:12px;color:#9ca3af;">
              이런 메일을 그만 받으려면 <a th:href="${unsubscribeUrl}" style="color:#6b7280;">수신 거부</a>를 눌러 주세요.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
