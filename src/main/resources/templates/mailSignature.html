<!--/* 메일 본문의 서명 자리에 넣는 조각. 메일 프로그램이 <style>을 지우므로 태그마다 스타일을 직접 넣는다. 여백·스타일 값은 MailSignatureRenderer가 정한다 */-->
<div th:style="${s.containerStyle}">
  <div style="width:36px;height:0;border-top:1px solid #eb6d09;font-size:0;line-height:0;"></div>
  <div th:if="${s.hasIdentity}" th:style="${s.identityStyle}"><strong th:if="${s.name != null}" style="font-size:13px;font-weight:700;color:#363636;letter-spacing:-1px;" th:text="${s.name}">이름</strong><span th:if="${s.englishName != null}" th:style="${s.englishNameStyle}" th:text="${s.englishName}">영문 이름</span><span th:if="${s.showSeparator}" style="margin:0 6px;color:#898989;">·</span><span th:if="${s.roleLine != null}" style="color:#898989;" th:text="${s.roleLine}">소속 / 직함</span></div>
  <div th:if="${s.hasContacts}" th:style="${s.contactsStyle}">
    <div th:each="c : ${s.contacts}"><strong th:if="${c.label != null}" th:style="${s.labelStyle}" th:text="${c.label}">Email</strong><a th:if="${c.href != null}" th:href="${c.href}" th:style="${c.valueStyle}" th:text="${c.value}">값</a><span th:if="${c.href == null}" th:style="${c.valueStyle}" th:text="${c.value}">값</span></div>
  </div>
  <!--/* 로고와 문구를 한 줄에 세로 가운데로 맞추려고 표를 쓴다. 메일 프로그램은 flex를 지원하지 않는다 */-->
  <table th:if="${s.hasBottom}" role="presentation" cellpadding="0" cellspacing="0" border="0" th:style="${s.bottomStyle}">
    <tr>
      <td th:if="${s.logoUrl != null}" style="padding:0;vertical-align:middle;"><a th:href="${s.siteUrl}" style="text-decoration:none;"><img th:src="${s.logoUrl}" src="" width="38" height="18" alt="키오스쿨" style="display:block;width:38px;height:18px;border:0;"></a></td>
      <td th:if="${s.slogan != null}" th:style="${s.sloganStyle}" th:text="${s.slogan}">한 줄 문구</td>
    </tr>
  </table>
</div>
